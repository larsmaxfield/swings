<html>
    <head>
        <title>Hillshade: resampling = 'nearest'</title>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" crossorigin="anonymous">
        <script src="../maplibre-gl.js" crossorigin="anonymous"></script>
        <style>
            body {
                margin: 0;
            }
            #map {
                height:100%; width:100%;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <script type="text/javascript">

            const map = new maplibregl.Map({
              container: "map",
              zoom: 16,
              center: [11.4, 47.35],
              style: {
                version: 8,
                sources: {
                  source: {
                    type: "raster-dem",
                      url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json',
                      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
                      encoding: "terrarium",
                      maxzoom: 13,
                  },
                },
                layers: [
                  {
                    id: "hillshade",
                    source: "source",
                    type: "hillshade",
                    paint: {
                      resampling: 'nearest'
                    },
                  },
                ],
              },
            });
        </script>
    </body>
</html>
