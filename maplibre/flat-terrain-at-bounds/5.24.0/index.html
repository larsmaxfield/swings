<html>
    <head>
        <title>@5.24.0: Flat terrain at bounds</title>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" crossorigin="anonymous">
        <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
        <style>
            body {
                container-type: size;
                margin: 0;
                display: grid;
                place-items: center;
            }
            * {
                box-sizing: border-box;
            }
            #map {
                width: min(100cqw, 100cqh);
                height: min(100cqw, 100cqh);
                border: 1px solid CanvasText;
                .instruct {
                    font-size: 2rem;
                    line-height: 1em;
                }
            }
        </style>
    </head>
    <body>
        <div id="map">
            <div class="instruct">
                <p>Zoom in/out:</p>
                <p>Terrain appears/flattens when pitched and centered against bounds</p>
            </div>
        </div>
        <script>

            const map = new maplibregl.Map({
                container: 'map',
                zoom: 1.65,
                center: [0, -85],
                pitch: 70,
                hash: true,
                style: {
                    version: 8,
                    sources: {
                        terrainSource: {
                            type: 'raster-dem',
                            url: 'https://tiles.mapterhorn.com/tilejson.json'
                        },
                        hillshadeSource: {
                            type: 'raster-dem',
                            url: 'https://tiles.mapterhorn.com/tilejson.json'
                        }
                    },
                    layers: [
                        {
                            id: 'hills',
                            type: 'hillshade',
                            source: 'hillshadeSource',
                            layout: {visibility: 'visible'},
                            paint: {'hillshade-shadow-color': '#473B24'}
                        }
                    ],
                    terrain: {
                        source: 'terrainSource',
                        exaggeration: 200
                    },
                },
            });
        </script>
    </body>
</html>
